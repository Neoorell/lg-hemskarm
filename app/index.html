<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Hemskärm</title>
<!--
  Egen hemskärm i Luma/Apple TV-stil för LG webOS, skriven för webOS 4.5 (Chromium 53):
  ingen inset, flex-gap, grid, min()/max() eller backdrop-filter.
  Logotyper för Netflix, YouTube och Prime Video från github.com/NaveenDA/lg-webos-custom-home (MIT).
-->
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
    background: #05060c; color: #fff;
    font-family: "LG Smart UI", "Helvetica Neue", Arial, sans-serif;
  }
  .fill { position: absolute; top: 0; right: 0; bottom: 0; left: 0; }

  #sky { background: radial-gradient(ellipse at 30% 110%, #2a2440 0%, rgba(42,36,64,0) 60%), linear-gradient(180deg, #05060c 0%, #0b1022 55%, #1a1f33 100%); }
  #photo { background-size: cover; background-position: center; opacity: 0; transition: opacity 1.2s ease; }
  #photo.loaded { opacity: 1; }
  #dim { background: linear-gradient(180deg, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0.05) 32%, rgba(0,0,0,0.15) 55%, rgba(0,0,0,0.85) 100%); }

  /* ---- överst: klocka och väder ---- */
  .clock { position: absolute; top: 56px; left: 80px; text-shadow: 0 2px 24px rgba(0,0,0,0.45); }
  .time { font-size: 150px; font-weight: 300; letter-spacing: -4px; line-height: 1; }
  .date { font-size: 32px; font-weight: 400; color: rgba(255,255,255,0.85); margin-top: 10px; }
  .date:first-letter { text-transform: uppercase; }

  .weather { position: absolute; top: 70px; right: 84px; display: none; align-items: center; text-shadow: 0 2px 20px rgba(0,0,0,0.45); }
  .weather.show { display: flex; }
  .weather svg { width: 84px; height: 84px; margin-right: 18px; filter: drop-shadow(0 2px 10px rgba(0,0,0,0.35)); }
  .w-temp { font-size: 64px; font-weight: 300; line-height: 1; }
  .w-text { font-size: 22px; color: rgba(255,255,255,0.8); margin-top: 6px; }

  /* ---- rader ---- */
  .sections { position: absolute; left: 0; right: 0; bottom: 56px; }
  .section { margin-top: 10px; }
  .label { font-size: 17px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: rgba(255,255,255,0.6); padding-left: 84px; }
  .row { display: flex; overflow: hidden; padding: 26px 84px 20px; }
  .row > * { flex-shrink: 0; margin-right: 28px; }

  /* app-ruta: lyfts när den är markerad, namnet syns bara då (som på Apple TV) */
  .app { width: 220px; text-align: center; }
  .tile {
    width: 220px; height: 132px; border-radius: 22px; position: relative; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 18px rgba(0,0,0,0.35);
    transition: transform .22s ease, box-shadow .22s ease;
  }
  .tile:after {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 55%;
    background: linear-gradient(180deg, rgba(255,255,255,0.16), rgba(255,255,255,0));
    opacity: 0; transition: opacity .22s ease;
  }
  .focused .tile { transform: translateY(-8px) scale(1.14); box-shadow: 0 28px 50px rgba(0,0,0,0.6), 0 0 0 3px rgba(255,255,255,0.85); }
  .focused .tile:after { opacity: 1; }
  .app.missing .tile { opacity: 0.4; }
  .app-name { margin-top: 26px; font-size: 22px; font-weight: 600; opacity: 0; transition: opacity .2s ease; text-shadow: 0 1px 8px rgba(0,0,0,0.6); }
  .app.focused .app-name { opacity: 1; }

  .wordmark { font-size: 32px; font-weight: 700; letter-spacing: -0.5px; line-height: 1.1; }
  /* TV:ns app-ikon i 115x115 på appens iconColor, precis som LG:s hemrad visar den. */
  .tile img.tv-icon { width: 115px; height: 115px; flex-shrink: 0; }
  .icon60 svg { width: 66px; height: 66px; display: block; }
  .yt-badge svg { width: 74px; height: auto; display: block; }

  /* ingång: mindre, pillerformad */
  .input {
    height: 76px; padding: 0 30px 0 22px; border-radius: 38px;
    display: flex; align-items: center;
    background: rgba(20,22,30,0.55); border: 2px solid rgba(255,255,255,0.18);
    transition: transform .22s ease, background .22s ease, border-color .22s ease;
  }
  .input svg { width: 40px; height: 40px; margin-right: 14px; }
  .input-name { font-size: 24px; font-weight: 600; }
  .input.focused { transform: scale(1.1); background: rgba(255,255,255,0.95); border-color: #fff; color: #111; }
  .input.focused svg { stroke: #111; }
  /* kugghjulet sist bland ingångarna; pricken visar att en ny version finns */
  .input.gear { padding: 0 18px; position: relative; }
  .input.gear svg { margin-right: 0; }
  .badge { position: absolute; top: 6px; right: 6px; width: 16px; height: 16px; border-radius: 8px; background: #ff4757; border: 2px solid #fff; display: none; }
  .badge.show { display: block; }

  /* ---- inställningsmenyn ---- */
  #meny { background: rgba(0,0,0,0.72); display: none; }
  #meny.show { display: block; }
  .m-panel {
    position: absolute; top: 90px; bottom: 90px; left: 50%; width: 980px; margin-left: -490px;
    background: #12141c; border-radius: 30px; box-shadow: 0 30px 80px rgba(0,0,0,0.6);
    padding: 44px 50px 0;
  }
  .m-title { font-size: 40px; font-weight: 600; }
  .m-sub { font-size: 20px; color: rgba(255,255,255,0.55); margin-top: 6px; height: 26px; }
  .m-list { position: absolute; top: 150px; bottom: 96px; left: 30px; right: 30px; overflow: hidden; }
  .m-row {
    display: flex; align-items: center; height: 76px; padding: 0 22px; margin-bottom: 6px;
    border-radius: 16px; font-size: 26px;
  }
  .m-row.focused { background: #fff; color: #111; }
  .m-row.dim { opacity: 0.45; }
  .m-thumb { width: 52px; height: 52px; border-radius: 10px; margin-right: 18px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .m-thumb img { width: 46px; height: 46px; }
  .m-label { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .m-value { font-size: 22px; color: rgba(255,255,255,0.6); margin-left: 20px; white-space: nowrap; }
  .m-row.focused .m-value { color: rgba(0,0,0,0.6); }
  .m-value.on { color: #2ed573; font-weight: 600; }
  .m-row.focused .m-value.on { color: #0a8f43; }
  .m-row input { font: inherit; font-size: 24px; width: 420px; padding: 8px 14px; border-radius: 10px; border: 2px solid #111; }
  .m-hint { position: absolute; left: 50px; right: 50px; bottom: 34px; font-size: 19px; color: rgba(255,255,255,0.55); }
  .m-hint b { color: #fff; font-weight: 600; }

  #toast {
    position: absolute; left: 50%; top: 64px; transform: translateX(-50%);
    background: rgba(0,0,0,0.82); padding: 14px 28px; border-radius: 14px; font-size: 22px;
    opacity: 0; transition: opacity .3s;
  }
  #toast.show { opacity: 1; }
</style>
<!-- Filer som bakgrundstjänsten skriver (saknas de händer inget) -->
<!-- Bilder utanför appens mapp får inte laddas, därför ligger ikonerna och bakgrunden i skript. -->
<script src="file:///media/developer/custom_home/tvapps.js"></script>
<script src="file:///media/developer/custom_home/ikoner.js"></script>
<script src="file:///media/developer/custom_home/bakgrund.js"></script>
<script src="file:///media/developer/custom_home/weather.js"></script>
<!-- Det som ändras i hemskärmens meny (kugghjulet eller gula knappen) -->
<script src="file:///media/developer/custom_home/installningar.js"></script>
</head>
<body>

  <canvas id="stars" class="fill"></canvas>
  <div id="photo" class="fill"></div>
  <div id="dim" class="fill"></div>

  <div class="clock">
    <div class="time" id="time">00:00</div>
    <div class="date" id="date"></div>

  <div class="weather" id="weather">

      <div class="m-sub" id="m-sub"></div>
      <div class="m-list" id="m-list"></div>

      };
    });
  }
  function allInputs() { return INST.ingangar instanceof Array ? INST.ingangar : INGANGAR; }
  function chosenInputs() { return allInputs().filter(function(i) { return !i.dold; }); }

  // ---- uppdateringar: jämför installerad version med app-källan på GitHub ----
  var UPPDATERING = null, APP_VERSION = null;
  function versionNewer(a, b) {
    var x = String(a).split("."), y = String(b).split(".");
    for (var i = 0; i < Math.max(x.length, y.length); i++) {
      var d = (parseInt(x[i], 10) || 0) - (parseInt(y[i], 10) || 0);
      if (d) return d > 0;
    }
    return false;
  }
  function installedVersion() {
    var list = window.TV_APPS || [];
    for (var i = 0; i < list.length; i++) if (list[i].id === "se.minhemskarm.launcher") return list[i].version || null;
    return null;
  }
  function checkUpdate(cb) {
    APP_VERSION = installedVersion();
    var x = new XMLHttpRequest();
    x.onload = function() {
      var pkg = null;
      try { pkg = JSON.parse(x.responseText).packages[0].manifest; } catch (e) {}
      UPPDATERING = (pkg && APP_VERSION && versionNewer(pkg.version, APP_VERSION))
        ? { version: pkg.version, ipkUrl: pkg.ipkUrl, sha: pkg.ipkHash && pkg.ipkHash.sha256 } : null;
      var b = document.getElementById("badge");
      if (b) b.className = "badge" + (UPPDATERING ? " show" : "");
      if (cb) cb(pkg ? pkg.version : null);
    };
    x.onerror = function() { if (cb) cb(null); };
    x.open("GET", REPO_URL + "?t=" + Date.now());
    x.send();
  }

  // ---- rutor ----
  function fillLogo(el, item) {
    function textLogo() {
      if (item.svg && LOGOS[item.svg]) { el.innerHTML = LOGOS[item.svg]; return; }
      var w = document.createElement("div");
      w.className = "wordmark";
      w.textContent = item.text || item.namn;
      el.innerHTML = "";
      el.appendChild(w);
    }
    if (item.icon) {
      var img = document.createElement("img");
      img.className = "tv-icon";
      if (item.iconBg) el.style.background = item.iconBg;
      img.onerror = function() { el.style.background = item.bg; textLogo(); };
      img.src = item.icon;
      el.appendChild(img);
    } else {
      textLogo();
    }
  }
  function makeAppTile(item) {
    var wrap = document.createElement("div");
    wrap.className = "app" + (item.missing ? " missing" : "");
    var tile = document.createElement("div");
    tile.className = "tile";
    tile.style.background = item.bg;
    fillLogo(tile, item);
    var name = document.createElement("div");
    name.className = "app-name";
    name.textContent = item.namn;
    wrap.appendChild(tile);
    wrap.appendChild(name);
    return { el: wrap, item: item };
  }
  function makeInputTile(item) {
    var el = document.createElement("div");
    el.className = "input";
    el.innerHTML = HDMI_SVG + '<span class="input-name"></span>';
    el.querySelector(".input-name").textContent = item.namn;
    return { el: el, item: item };
  }
  function makeGearTile() {
    var el = document.createElement("div");
    el.className = "input gear";
    el.innerHTML = GEAR_SVG + '<span class="badge' + (UPPDATERING ? " show" : "") + '" id="badge"></span>';
    return { el: el, item: { meny: true, namn: "Inställningar" } };
  }

  // ---- uppbyggnad och fjärrkontroll ----
  var groups = [], curGroup = 0, curIndex = 0;

  function makeSection(title, entries, gi) {
    var sec = document.createElement("div");
    sec.className = "section";
    var lbl = document.createElement("div");
    lbl.className = "label";
    lbl.textContent = title;
    var row = document.createElement("div");
    row.className = "row";
    entries.forEach(function(e, idx) {
      e.row = row;
      row.appendChild(e.el);
      e.el.addEventListener("mouseover", function() { focusAt(gi, idx); });
      e.el.addEventListener("click", function() { launch(e.item); });
    });
    sec.appendChild(lbl);
    sec.appendChild(row);
    return sec;
  }

  function render(tvApps) {
    var apps = chosenApps(tvApps).map(makeAppTile);
    var inputs = chosenInputs().map(makeInputTile).concat([makeGearTile()]);
    var order = INGANGAR_FORST ? [["Ingångar", inputs], ["Appar", apps]] : [["Appar", apps], ["Ingångar", inputs]];
    var container = document.getElementById("sections");
    container.innerHTML = "";
    groups = [];
    order.forEach(function(o, gi) {
      groups.push(o[1]);
      container.appendChild(makeSection(o[0], o[1], gi));
    });
    // Börja på apparna
    focusAt(INGANGAR_FORST ? 1 : 0, 0);
  }

  function scrollIntoRow(e) {
    var row = e.row, el = e.el;
    var left = el.offsetLeft - row.offsetLeft, right = left + el.offsetWidth;
    if (left - 84 < row.scrollLeft) row.scrollLeft = left - 84;
    else if (right + 84 > row.scrollLeft + row.clientWidth) row.scrollLeft = right + 84 - row.clientWidth;
  }
  function focusAt(g, i) {
    if (!groups.length || !groups[g] || !groups[g].length) return;
    groups.forEach(function(grp) { grp.forEach(function(e) { e.el.classList.remove("focused"); }); });
    curGroup = g;
    curIndex = Math.max(0, Math.min(groups[g].length - 1, i));
    var e = groups[curGroup][curIndex];
    e.el.classList.add("focused");
    scrollIntoRow(e);
  }

  // webOS 4.5 skickar keyCode (37-40 pilar, 13 OK, 461 BACK, 405 gul).
  // BACK når sidan för att appinfo.json har disableBackHistoryAPI; utan det stängs hemskärmen.
  document.addEventListener("keydown", function(ev) {
    var k = ev.keyCode;
    if (Meny.isOpen()) {
      if (Meny.key(k)) ev.preventDefault();
      return;
    }
    if (k === 461) { /* BACK: stanna kvar på hemskärmen */ }
    else if (k === 405) Meny.open();
    else if (k === 39) focusAt(curGroup, curIndex + 1);
    else if (k === 37) focusAt(curGroup, curIndex - 1);
    else if (k === 40) focusAt(Math.min(groups.length - 1, curGroup + 1), curIndex);
    else if (k === 38) focusAt(Math.max(0, curGroup - 1), curIndex);
    else if (k === 13) launch(groups[curGroup][curIndex].item);
    else return;
    ev.preventDefault();
  });

  // Först listan från bakgrundstjänsten, annars fråga TV:n direkt.
  if (window.TV_APPS && window.TV_APPS.length) {
    render(window.TV_APPS);
  } else {
    render(null);
    callLuna("luna://com.webos.applicationManager/listApps", {}, function(resp) {
      if (resp && resp.apps && resp.apps.length) render(resp.apps);
    });
  }
  checkUpdate();

  // HOME när hemskärmen redan körs (LG:s ändrade hemrad startar den utan att ladda om):
  // börja om på apparna, och ladda om sidan efter en halvtimme så att vädret och apparna är färska.
  var loadedAt = Date.now();
  document.addEventListener("webOSRelaunch", function() {
    if (Meny.isOpen()) return;
    if (Date.now() - loadedAt > 30 * 60 * 1000) { location.reload(); return; }
    focusAt(INGANGAR_FORST ? 1 : 0, 0);
  });
</script>
<script src="meny.js"></script>
</body>
